<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スコア">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b7f4b">
<link rel="manifest" href="manifest.webmanifest">
<title>ゴルフスコア</title>
<style>
:root{
  --green:#1b7f4b; --green-d:#146039; --red:#c0392b; --amber:#b45309;
  --ink:#111418; --muted:#667085; --line:#d8dce2; --bg:#fff; --soft:#f4f6f8;
  --tap:58px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink); background:var(--bg); font-size:16px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:var(--green); color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex;
  align-items:center; gap:10px; min-height:44px;
}
header .ttl{font-weight:700; font-size:17px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
header button{
  background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px;
  padding:8px 12px; font-size:15px; font-weight:600; min-height:38px;
}
main{padding:14px; max-width:640px; margin:0 auto}
.view{display:none}
.view.active{display:block}
h2{font-size:18px; margin:22px 0 10px}
h2:first-child{margin-top:4px}
p.note{color:var(--muted); font-size:14px; margin:6px 0}
button{font-family:inherit; cursor:pointer}
.btn{
  display:block; width:100%; min-height:var(--tap); border:0; border-radius:12px;
  background:var(--green); color:#fff; font-size:17px; font-weight:700;
  margin:10px 0; padding:14px;
}
.btn.sub{background:var(--soft); color:var(--ink); border:1px solid var(--line)}
.btn.warn{background:var(--red)}
.btn:disabled{opacity:.4}
label{display:block; font-size:14px; font-weight:600; color:var(--muted); margin:14px 0 5px}
input,select,textarea{
  width:100%; font-family:inherit; font-size:16px; padding:12px;
  border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
}
textarea{min-height:72px; resize:vertical}
.card{border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; background:#fff}
.card.tap{display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-size:16px}
.row{display:flex; gap:10px; align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted); font-size:14px}
.big{font-size:34px; font-weight:800; letter-spacing:-.5px}

/* ラウンド入力 */
.holebar{
  display:flex; align-items:baseline; gap:12px; padding:12px 0 8px; border-bottom:2px solid var(--line);
}
.holeno{font-size:30px; font-weight:800}
.holemeta{color:var(--muted); font-size:14px}
.running{margin-left:auto; text-align:right}
.running b{font-size:22px}
.grid{display:grid; gap:8px; margin:8px 0 4px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g6 .opt{font-size:20px; min-height:52px}
.opt{
  min-height:var(--tap); border:1.5px solid var(--line); background:#fff; border-radius:12px;
  font-size:19px; font-weight:700; color:var(--ink); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; padding:6px 2px;
}
.opt small{font-size:11px; font-weight:600; color:var(--muted); line-height:1}
.opt.on{background:var(--green); border-color:var(--green); color:#fff}
.opt.on small{color:rgba(255,255,255,.85)}
.opt.on.neg{background:var(--red); border-color:var(--red)}
.step{display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
.step button{width:56px; min-height:52px; border:0; background:var(--soft); font-size:24px; font-weight:700; color:var(--ink)}
.step span{flex:1; text-align:center; font-size:20px; font-weight:700}
.step.hot span{color:var(--red)}
.navrow{
  display:flex; gap:10px; position:sticky; bottom:0; z-index:5; margin:16px 0 0;
  padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to bottom, rgba(255,255,255,0), #fff 26%);
}
.navrow .btn{margin:0}
.navrow .btn.sub{flex:0 0 30%}
.progress{height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin:8px 0 2px}
.progress i{display:block; height:100%; background:var(--green)}

/* スコアカード表 */
.sc{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.sc th,.sc td{border:1px solid var(--line); padding:5px 3px; text-align:center}
.sc th{background:var(--soft); font-weight:600; color:var(--muted)}
.sc td.s{font-weight:700; font-size:15px}
.sc .bir{color:var(--red)}
.sc .bog{color:var(--muted)}
.sc .dbl{color:var(--amber); font-weight:800}
.sc tr.tot td{background:var(--soft); font-weight:700}
.wrapx{overflow-x:auto; -webkit-overflow-scrolling:touch}

.stat{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.stat div{border:1px solid var(--line); border-radius:10px; padding:10px}
.stat b{display:block; font-size:22px; font-weight:800}
.stat small{color:var(--muted); font-size:12px}

.pill{display:inline-block; padding:3px 9px; border-radius:99px; background:var(--soft); font-size:12px; color:var(--muted); font-weight:600}
.pill.ok{background:#e7f5ee; color:var(--green-d)}
.pill.ng{background:#fdecea; color:var(--red)}
.hidden{display:none !important}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:#111; color:#fff;
  padding:12px 18px; border-radius:10px; font-size:14px; z-index:99; max-width:90%; text-align:center;
}
</style>
</head>
<body>

<header>
  <button id="back" class="hidden">‹ 戻る</button>
  <div class="ttl" id="title">ゴルフスコア</div>
</header>

<main>

<!-- ===== ホーム ===== -->
<section id="v-home" class="view active">
  <div id="resumeBox"></div>
  <button class="btn" id="goNew">新しいラウンドを開始</button>
  <button class="btn sub" id="goCourses">コースを管理</button>
  <button class="btn sub" id="goSaveDir">保存先フォルダを設定</button>
  <p class="note" id="saveDirNote"></p>
  <h2>これまでのラウンド</h2>
  <div id="roundList"></div>
</section>

<!-- ===== 新規ラウンド ===== -->
<section id="v-new" class="view">
  <label>コース</label>
  <select id="nCourse"></select>
  <p class="note" id="nCourseNote"></p>
  <label>ティー</label>
  <select id="nTee"></select>
  <label>日付</label>
  <input type="date" id="nDate">
  <label>天候・風・グリーン(任意)</label>
  <input type="text" id="nWeather" placeholder="晴れ 風強め グリーン速い">
  <label>同伴者(任意・カンマ区切り)</label>
  <input type="text" id="nPlayers" placeholder="田中さん, 佐藤さん">
  <button class="btn" id="startRound">スタート</button>
</section>

<!-- ===== 入力 ===== -->
<section id="v-play" class="view">
  <div class="holebar">
    <div>
      <div class="holeno" id="pHole">1</div>
      <div class="holemeta" id="pMeta">Par 4</div>
    </div>
    <div class="running">
      <div class="muted" style="font-size:12px">ここまで</div>
      <b id="pRunning">±0</b>
    </div>
  </div>
  <div class="progress"><i id="pBar"></i></div>

  <div class="row"><label style="flex:1">打数</label>
    <button id="pStrokeOther" style="border:0;background:none;color:var(--green);font-size:14px;font-weight:700;padding:8px 0">その他の打数…</button></div>
  <div class="grid g4" id="pStrokes"></div>

  <label id="pPuttLabel">パット数</label>
  <div class="grid g6" id="pPutts"></div>

  <div id="pFwBox">
    <label>ティーショット</label>
    <div class="grid g3" id="pFw"></div>
  </div>

  <div class="row" style="gap:12px; margin-top:16px">
    <div style="flex:1">
      <label style="margin-top:0">OB</label>
      <div class="step" id="pOb"><button data-d="-1">−</button><span>0</span><button data-d="1">＋</button></div>
    </div>
    <div style="flex:1">
      <label style="margin-top:0">その他の罰打</label>
      <div class="step" id="pPen"><button data-d="-1">−</button><span>0</span><button data-d="1">＋</button></div>
    </div>
  </div>

  <label>このホールのメモ(任意)</label>
  <input type="text" id="pNote" placeholder="2打目を右へ / 3パット など">

  <button class="btn sub" id="pFinish" style="margin-top:20px">ラウンドを終了して保存</button>

  <div class="navrow">
    <button class="btn sub" id="pPrev">‹ 前</button>
    <button class="btn" id="pNext">次のホールへ ›</button>
  </div>
</section>

<!-- ===== サマリー ===== -->
<section id="v-summary" class="view">
  <div id="sHead"></div>
  <h2>スコアカード</h2>
  <div class="wrapx" id="sCard"></div>
  <h2>速報</h2>
  <div class="stat" id="sStat"></div>
  <h2>保存とAI分析</h2>
  <p class="note">JSON と Markdown をGoogleドライブに保存します。分析は保存したファイルをClaudeに渡すか、下のプロンプトを貼り付けてください。</p>
  <button class="btn" id="sSave">Googleドライブに保存</button>
  <button class="btn sub" id="sPrompt">Claude用の分析プロンプトをコピー</button>
  <button class="btn sub" id="sHome">ホームに戻る</button>
</section>

<!-- ===== コース一覧 ===== -->
<section id="v-courses" class="view">
  <p class="note">コースのパー・HDCP・ヤーデージを登録しておくと、入力が速くなり分析の精度も上がります。Claudeに調べさせたJSONを貼り付けるのが一番早い方法です。</p>
  <button class="btn" id="cImport">JSONを貼り付けて追加</button>
  <button class="btn sub" id="cFile">JSONファイルから読み込む</button>
  <button class="btn sub" id="cManual">手入力で新規作成</button>
  <input type="file" id="cFileInput" accept=".json,application/json" class="hidden">
  <h2>登録済みのコース</h2>
  <div id="courseList"></div>
</section>

<!-- ===== コース編集 ===== -->
<section id="v-courseEdit" class="view">
  <label>コース名</label>
  <input type="text" id="eName" placeholder="〇〇カントリークラブ(東→西)">
  <label>所在地(任意)</label>
  <input type="text" id="eLoc" placeholder="千葉県">
  <label>ティー名(カンマ区切り)</label>
  <input type="text" id="eTees" placeholder="バック, レギュラー, フロント">
  <label>ホール数</label>
  <select id="eCount"><option value="18">18ホール</option><option value="9">9ホール</option></select>
  <h2>各ホール</h2>
  <div class="wrapx" id="eHoles"></div>
  <button class="btn" id="eSave">保存</button>
  <button class="btn warn" id="eDelete">このコースを削除</button>
</section>

</main>

<script>
/* =========================================================================
   ゴルフスコア — 入力に徹したアプリ。分析はエクスポートしたファイルをClaudeへ。
   データはすべて端末内(localStorage)に保存し、明示的にドライブへ書き出す。
   ========================================================================= */

const K = { courses:'golf.courses', rounds:'golf.rounds', current:'golf.current' };
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('保存に失敗: '+e.message); } }
};
let courses = LS.get(K.courses, []);
let rounds  = LS.get(K.rounds, []);
let cur     = LS.get(K.current, null);   // 進行中のラウンド
let idx     = 0;                          // 表示中のホール(0始まり)
let editing = null;                       // 編集中のコース

const FW = ['キープ','左','右'];
const SCORE_NAME = {'-3':'アルバトロス','-2':'イーグル','-1':'バーディ','0':'パー','1':'ボギー','2':'ダブル','3':'トリプル','4':'+4'};

/* ---------- 画面遷移 ---------- */
const views = ['v-home','v-new','v-play','v-summary','v-courses','v-courseEdit'];
let backTo = null;
function show(id, title, back){
  views.forEach(v => document.getElementById(v).classList.toggle('active', v===id));
  document.getElementById('title').textContent = title || 'ゴルフスコア';
  backTo = back || null;
  document.getElementById('back').classList.toggle('hidden', !back);
  window.scrollTo(0,0);
}
document.getElementById('back').onclick = () => { if(backTo) backTo(); };

function toast(msg, ms){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms||2200);
}

/* ---------- 保存先フォルダ(PC Chrome の File System Access API) ---------- */
function idb(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open('golf-score',1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res,rej)=>{ const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
async function idbSet(k,v){
  const db = await idb();
  return new Promise((res,rej)=>{ const r = db.transaction('kv','readwrite').objectStore('kv').put(v,k); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
async function getDir(){
  if(!window.showDirectoryPicker) return null;
  const h = await idbGet('dir').catch(()=>null);
  if(!h) return null;
  try{
    if(await h.queryPermission({mode:'readwrite'}) === 'granted') return h;
    if(await h.requestPermission({mode:'readwrite'}) === 'granted') return h;
  }catch(e){}
  return null;
}
async function pickDir(){
  if(!window.showDirectoryPicker){
    alert('この端末では保存先フォルダを指定できません(PCのChrome/Edgeのみ対応)。\niPhoneでは保存時に共有シートが開くので、そこから Googleドライブ を選んでください。');
    return;
  }
  try{
    const h = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('dir', h);
    toast('保存先を設定しました: ' + h.name);
    renderSaveDirNote();
  }catch(e){ /* キャンセル */ }
}
async function renderSaveDirNote(){
  const el = document.getElementById('saveDirNote');
  if(!window.showDirectoryPicker){
    el.textContent = 'この端末(iPhone等)は共有シート経由でGoogleドライブに保存します。設定は不要です。';
    document.getElementById('goSaveDir').classList.add('hidden');
    return;
  }
  const h = await getDir();
  el.textContent = h ? ('保存先: ' + h.name + ' フォルダ') : 'Googleドライブの同期フォルダ内に「ゴルフ」フォルダを作って選んでおくと、保存が一発になります。';
}

/* ---------- ファイル書き出し ---------- */
async function saveFiles(files){
  const dir = await getDir();
  if(dir){
    try{
      for(const f of files){
        const fh = await dir.getFileHandle(f.name, {create:true});
        const w = await fh.createWritable();
        await w.write(new Blob([f.text], {type:'text/plain;charset=utf-8'}));
        await w.close();
      }
      toast('保存しました → ' + dir.name);
      return true;
    }catch(e){ toast('フォルダへの保存に失敗: ' + e.message); }
  }
  // iPhone等: 共有シートからGoogleドライブへ
  const blobs = files.map(f => new File([f.text], f.name, {type:'application/json'}));
  if(navigator.canShare && navigator.canShare({files: blobs})){
    try{
      await navigator.share({files: blobs, title: files[0].name});
      return true;
    }catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  // 最終手段: ダウンロード
  for(const f of files){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([f.text], {type:'application/json'}));
    a.download = f.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }
  toast('ダウンロードしました。ファイルアプリからドライブへ移してください。', 3500);
  return true;
}

/* ---------- コース ---------- */
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function normalizeCourse(o){
  if(!o || typeof o !== 'object') throw new Error('JSONの形式が違います');
  const name = o.name || o['名前'] || o['コース名'];
  if(!name) throw new Error('name(コース名)がありません');
  const rawHoles = o.holes || o['ホール'];
  if(!Array.isArray(rawHoles) || !rawHoles.length) throw new Error('holes(ホール配列)がありません');
  const tees = Array.isArray(o.tees) && o.tees.length ? o.tees.slice() : ['レギュラー'];
  const holes = rawHoles.map((h,i)=>{
    const yards = h.yards || h['ヤード'] || {};
    return {
      no: Number(h.no || h['番号'] || i+1),
      par: Number(h.par || h['パー'] || 4),
      hdcp: (h.hdcp==null && h['hdcp']==null) ? null : Number(h.hdcp!=null ? h.hdcp : h['hdcp']),
      yards: (typeof yards === 'number') ? {[tees[0]]: yards} : yards
    };
  });
  return { id:o.id || newId(), name, location:o.location || o['所在地'] || '', note:o.note || '', tees, holes };
}
function saveCourses(){ LS.set(K.courses, courses); }

function renderCourseList(){
  const el = document.getElementById('courseList');
  if(!courses.length){ el.innerHTML = '<p class="note">まだコースがありません。</p>'; return; }
  el.innerHTML = '';
  courses.forEach(c => {
    const par = c.holes.reduce((s,h)=>s+h.par,0);
    const b = document.createElement('button');
    b.className = 'card tap';
    b.innerHTML = '<div style="flex:1"><b>'+esc(c.name)+'</b><div class="muted">'
      + c.holes.length + 'ホール / Par ' + par + (c.location ? ' / '+esc(c.location) : '') + '</div></div><span class="muted">編集 ›</span>';
    b.onclick = () => openCourseEdit(c);
    el.appendChild(b);
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function openCourseEdit(c){
  editing = c ? JSON.parse(JSON.stringify(c)) : {id:newId(), name:'', location:'', tees:['レギュラー'], holes:[], note:''};
  if(!editing.holes.length) editing.holes = mkHoles(18);
  document.getElementById('eName').value = editing.name;
  document.getElementById('eLoc').value = editing.location || '';
  document.getElementById('eTees').value = editing.tees.join(', ');
  document.getElementById('eCount').value = String(editing.holes.length === 9 ? 9 : 18);
  document.getElementById('eDelete').classList.toggle('hidden', !c);
  renderHoleEditor();
  show('v-courseEdit', c ? 'コースを編集' : 'コースを作成', openCourses);
}
function mkHoles(n){
  return Array.from({length:n}, (_,i)=>({no:i+1, par:4, hdcp:null, yards:{}}));
}
function renderHoleEditor(){
  const tees = document.getElementById('eTees').value.split(',').map(s=>s.trim()).filter(Boolean);
  const t0 = tees[0] || 'レギュラー';
  let html = '<table class="sc"><tr><th>H</th><th>Par</th><th>HDCP</th><th>'+esc(t0)+'(yd)</th></tr>';
  editing.holes.forEach((h,i)=>{
    html += '<tr><td>'+h.no+'</td>'
      + '<td><select data-i="'+i+'" data-f="par" style="padding:6px;font-size:15px">'
      + [3,4,5,6].map(p=>'<option value="'+p+'"'+(h.par===p?' selected':'')+'>'+p+'</option>').join('')
      + '</select></td>'
      + '<td><input data-i="'+i+'" data-f="hdcp" type="number" inputmode="numeric" value="'+(h.hdcp==null?'':h.hdcp)+'" style="padding:6px;font-size:15px;width:64px"></td>'
      + '<td><input data-i="'+i+'" data-f="yard" type="number" inputmode="numeric" value="'+(h.yards[t0]==null?'':h.yards[t0])+'" style="padding:6px;font-size:15px;width:78px"></td></tr>';
  });
  html += '</table>';
  const box = document.getElementById('eHoles');
  box.innerHTML = html;
  box.oninput = (ev)=>{
    const el = ev.target, i = el.dataset.i;
    if(i==null) return;
    const h = editing.holes[+i], v = el.value;
    if(el.dataset.f==='par') h.par = +v;
    if(el.dataset.f==='hdcp') h.hdcp = v==='' ? null : +v;
    if(el.dataset.f==='yard'){ if(v==='') delete h.yards[t0]; else h.yards[t0] = +v; }
  };
}
document.getElementById('eCount').onchange = (e)=>{
  const n = +e.target.value;
  editing.holes = mkHoles(n).map((h,i)=> editing.holes[i] ? {...h, ...editing.holes[i], no:i+1} : h);
  renderHoleEditor();
};
document.getElementById('eTees').oninput = renderHoleEditor;
document.getElementById('eSave').onclick = ()=>{
  const name = document.getElementById('eName').value.trim();
  if(!name){ alert('コース名を入力してください'); return; }
  editing.name = name;
  editing.location = document.getElementById('eLoc').value.trim();
  editing.tees = document.getElementById('eTees').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!editing.tees.length) editing.tees = ['レギュラー'];
  const i = courses.findIndex(c=>c.id===editing.id);
  if(i>=0) courses[i] = editing; else courses.push(editing);
  saveCourses(); renderCourseList(); openCourses();
  toast('保存しました');
};
document.getElementById('eDelete').onclick = ()=>{
  if(!confirm('このコースを削除しますか?(記録済みのラウンドは残ります)')) return;
  courses = courses.filter(c=>c.id!==editing.id);
  saveCourses(); renderCourseList(); openCourses();
};

function addCourseFromText(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ alert('JSONとして読めませんでした: ' + e.message); return; }
  const list = Array.isArray(data) ? data : [data];
  let n = 0;
  for(const o of list){
    try{
      const c = normalizeCourse(o);
      const i = courses.findIndex(x => x.name === c.name);
      if(i>=0){ c.id = courses[i].id; courses[i] = c; } else courses.push(c);
      n++;
    }catch(e){ alert('読み込めないデータがありました: ' + e.message); }
  }
  if(n){ saveCourses(); renderCourseList(); toast(n + '件のコースを取り込みました'); }
}
document.getElementById('cImport').onclick = ()=>{
  const t = prompt('コースのJSONを貼り付けてください');
  if(t) addCourseFromText(t);
};
document.getElementById('cFile').onclick = ()=> document.getElementById('cFileInput').click();
document.getElementById('cFileInput').onchange = async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  addCourseFromText(await f.text());
  e.target.value = '';
};
document.getElementById('cManual').onclick = ()=> openCourseEdit(null);

/* ---------- ラウンド ---------- */
function openCourses(){ renderCourseList(); show('v-courses','コース管理', goHome); }

function goHome(){
  renderHome();
  show('v-home','ゴルフスコア', null);
}

function renderHome(){
  const box = document.getElementById('resumeBox');
  if(cur){
    const done = cur.holes.filter(h=>h.strokes!=null).length;
    box.innerHTML = '<div class="card" style="border-color:var(--green)"><b>進行中のラウンド</b>'
      + '<div class="muted">'+esc(cur.courseName)+' / '+esc(cur.date)+' / '+done+'ホール入力済み</div></div>';
    const b = document.createElement('button');
    b.className='btn'; b.textContent='ラウンドを再開';
    b.onclick = ()=>{ idx = Math.min(cur.holes.findIndex(h=>h.strokes==null) === -1 ? cur.holes.length-1 : cur.holes.findIndex(h=>h.strokes==null), cur.holes.length-1); openPlay(); };
    box.appendChild(b);
  } else box.innerHTML = '';

  const el = document.getElementById('roundList');
  if(!rounds.length){ el.innerHTML = '<p class="note">まだ記録がありません。</p>'; return; }
  el.innerHTML = '';
  rounds.slice().reverse().forEach(r=>{
    const st = stats(r);
    const b = document.createElement('button');
    b.className='card tap';
    b.innerHTML = '<div style="flex:1"><b>'+esc(r.date)+' '+esc(r.courseName)+'</b>'
      + '<div class="muted">'+st.total+' ('+fmtPar(st.vsPar)+') / '+st.putts+'パット</div></div><span class="muted">›</span>';
    b.onclick = ()=> openSummary(r, false);
    el.appendChild(b);
  });
}
function fmtPar(v){ return v>0 ? '+'+v : (v<0 ? String(v) : '±0'); }

document.getElementById('goNew').onclick = ()=>{
  if(!courses.length){
    if(confirm('先にコースを登録する必要があります。コース管理を開きますか?')) openCourses();
    return;
  }
  const sel = document.getElementById('nCourse');
  sel.innerHTML = courses.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  sel.onchange = fillTees; fillTees();
  document.getElementById('nDate').value = new Date().toISOString().slice(0,10);
  show('v-new','新しいラウンド', goHome);
};
function fillTees(){
  const c = courses.find(x=>x.id===document.getElementById('nCourse').value);
  document.getElementById('nTee').innerHTML = c.tees.map(t=>'<option>'+esc(t)+'</option>').join('');
  const withY = c.holes.filter(h=>Object.keys(h.yards||{}).length).length;
  const withH = c.holes.filter(h=>h.hdcp!=null).length;
  document.getElementById('nCourseNote').textContent =
    c.holes.length+'ホール / ヤーデージ登録 '+withY+'ホール / HDCP登録 '+withH+'ホール';
}
document.getElementById('goCourses').onclick = openCourses;
document.getElementById('goSaveDir').onclick = pickDir;

document.getElementById('startRound').onclick = ()=>{
  if(cur && !confirm('進行中のラウンドがあります。破棄して新しく始めますか?')) return;
  const c = courses.find(x=>x.id===document.getElementById('nCourse').value);
  const tee = document.getElementById('nTee').value;
  cur = {
    id: newId(),
    date: document.getElementById('nDate').value || new Date().toISOString().slice(0,10),
    courseId: c.id, courseName: c.name, courseLocation: c.location || '', tee,
    weather: document.getElementById('nWeather').value.trim(),
    players: document.getElementById('nPlayers').value.split(',').map(s=>s.trim()).filter(Boolean),
    startedAt: new Date().toISOString(),
    holes: c.holes.map(h=>({
      no:h.no, par:h.par, hdcp:h.hdcp==null?null:h.hdcp,
      yards: (h.yards && h.yards[tee]!=null) ? h.yards[tee] : null,
      strokes:null, putts:null, fw:null, ob:0, penalty:0, note:''
    }))
  };
  idx = 0; persist(); openPlay();
};
function persist(){ LS.set(K.current, cur); }

function openPlay(){
  renderHole();
  show('v-play', (cur.courseName || 'ラウンド'), ()=>{ goHome(); });
}

function renderHole(){
  const h = cur.holes[idx];
  document.getElementById('pHole').textContent = h.no;
  document.getElementById('pMeta').textContent =
    'Par ' + h.par + (h.yards ? ' / ' + h.yards + 'yd' : '') + (h.hdcp!=null ? ' / HDCP ' + h.hdcp : '');

  // ここまでの累計
  const done = cur.holes.filter(x=>x.strokes!=null);
  const vs = done.reduce((s,x)=>s + (x.strokes - x.par), 0);
  document.getElementById('pRunning').textContent = fmtPar(vs) + (done.length ? ' (' + done.length + 'H)' : '');

  // 打数
  const sb = document.getElementById('pStrokes'); sb.innerHTML='';
  for(let d=-2; d<=5; d++){
    const v = h.par + d;
    if(v < 1) continue;
    const b = document.createElement('button');
    b.className = 'opt' + (h.strokes===v ? ' on' : '') + (h.strokes===v && d<0 ? ' neg' : '');
    b.innerHTML = v + '<small>' + (SCORE_NAME[String(d)] || (d>0?'+'+d:'')) + '</small>';
    b.onclick = ()=>{ h.strokes = v; persist(); renderHole(); };
    sb.appendChild(b);
  }
  // パット
  document.getElementById('pPuttLabel').innerHTML =
    (h.strokes!=null && h.putts==null) ? 'パット数 <span style="color:var(--red)">未入力</span>' : 'パット数';
  const pb = document.getElementById('pPutts'); pb.innerHTML='';
  for(let p=0; p<=5; p++){
    const b = document.createElement('button');
    b.className = 'opt' + (h.putts===p ? ' on' : '');
    b.textContent = p;
    b.onclick = ()=>{ h.putts = p; persist(); renderHole(); };
    pb.appendChild(b);
  }
  // ティーショット(パー4以上のみ)
  document.getElementById('pFwBox').classList.toggle('hidden', h.par < 4);
  const fb = document.getElementById('pFw'); fb.innerHTML='';
  FW.forEach(v=>{
    const b = document.createElement('button');
    b.className = 'opt' + (h.fw===v ? ' on' : '') + (h.fw===v && v!=='キープ' ? ' neg' : '');
    b.textContent = v;
    b.onclick = ()=>{ h.fw = (h.fw===v ? null : v); persist(); renderHole(); };
    fb.appendChild(b);
  });
  // OB / 罰打
  setStep('pOb', h.ob);
  setStep('pPen', h.penalty);
  document.getElementById('pNote').value = h.note || '';

  document.getElementById('pPrev').disabled = idx===0;
  document.getElementById('pNext').textContent = idx===cur.holes.length-1 ? '最終ホール' : '次のホールへ ›';
  document.getElementById('pNext').disabled = idx===cur.holes.length-1;
  document.getElementById('pBar').style.width = Math.round(done.length / cur.holes.length * 100) + '%';
}
function setStep(id, v){
  const el = document.getElementById(id);
  el.querySelector('span').textContent = v;
  el.classList.toggle('hot', v>0);
}
['pOb','pPen'].forEach(id=>{
  document.getElementById(id).onclick = (ev)=>{
    const d = ev.target.dataset.d; if(!d) return;
    const h = cur.holes[idx];
    const f = id==='pOb' ? 'ob' : 'penalty';
    h[f] = Math.max(0, (h[f]||0) + (+d));
    setStep(id, h[f]); persist();
  };
});
document.getElementById('pNote').oninput = (e)=>{ cur.holes[idx].note = e.target.value; persist(); };
document.getElementById('pStrokeOther').onclick = ()=>{
  const h = cur.holes[idx];
  const v = prompt('打数を入力', h.strokes==null ? '' : String(h.strokes));
  if(v==null) return;
  const n = parseInt(v,10);
  if(!(n>=1 && n<=30)){ alert('1〜30の数字を入れてください'); return; }
  h.strokes = n; persist(); renderHole();
};
document.getElementById('pPrev').onclick = ()=>{ if(idx>0){ idx--; renderHole(); } };
document.getElementById('pNext').onclick = ()=>{ if(idx<cur.holes.length-1){ idx++; renderHole(); } };
document.getElementById('pFinish').onclick = ()=>{
  const missing = cur.holes.filter(h=>h.strokes==null).length;
  if(missing && !confirm(missing + 'ホールが未入力です。このまま終了しますか?')) return;
  cur.finishedAt = new Date().toISOString();
  rounds.push(cur);
  LS.set(K.rounds, rounds);
  const r = cur;
  cur = null; localStorage.removeItem(K.current);
  openSummary(r, true);
};

/* ---------- 集計 ---------- */
function stats(r){
  const hs = r.holes.filter(h=>h.strokes!=null);
  const ph = hs.filter(h=>h.putts!=null);
  const isGir = h => (h.strokes - h.putts) <= (h.par - 2);
  const gir = ph.filter(isGir);
  const nonGir = ph.filter(h=>!isGir(h));
  const fwh = hs.filter(h=>h.par>=4 && h.fw);
  const dist = {eagle:0, birdie:0, par:0, bogey:0, dbl:0, tri:0};
  hs.forEach(h=>{
    const d = h.strokes - h.par;
    if(d<=-2) dist.eagle++; else if(d===-1) dist.birdie++; else if(d===0) dist.par++;
    else if(d===1) dist.bogey++; else if(d===2) dist.dbl++; else dist.tri++;
  });
  const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);
  const out = hs.filter(h=>h.no<=9), inn = hs.filter(h=>h.no>9);
  return {
    played: hs.length,
    total: sum(hs,h=>h.strokes),
    totalPar: sum(hs,h=>h.par),
    vsPar: sum(hs,h=>h.strokes-h.par),
    out: sum(out,h=>h.strokes), in: sum(inn,h=>h.strokes),
    putts: sum(ph,h=>h.putts),
    puttsPerHole: ph.length ? +(sum(ph,h=>h.putts)/ph.length).toFixed(2) : null,
    threePutts: ph.filter(h=>h.putts>=3).length,
    onePutts: ph.filter(h=>h.putts===1).length,
    gir: gir.length, girHoles: ph.length,
    girPct: ph.length ? Math.round(gir.length/ph.length*100) : null,
    puttsOnGir: gir.length ? +(sum(gir,h=>h.putts)/gir.length).toFixed(2) : null,
    fwKeep: fwh.filter(h=>h.fw==='キープ').length, fwHoles: fwh.length,
    fwPct: fwh.length ? Math.round(fwh.filter(h=>h.fw==='キープ').length/fwh.length*100) : null,
    fwLeft: fwh.filter(h=>h.fw==='左').length, fwRight: fwh.filter(h=>h.fw==='右').length,
    scrambling: nonGir.filter(h=>h.strokes<=h.par).length, scramblingHoles: nonGir.length,
    scramblingPct: nonGir.length ? Math.round(nonGir.filter(h=>h.strokes<=h.par).length/nonGir.length*100) : null,
    ob: sum(hs,h=>h.ob||0), penalty: sum(hs,h=>h.penalty||0),
    dist
  };
}

/* ---------- サマリー ---------- */
let summaryRound = null;
function openSummary(r, isNew){
  summaryRound = r;
  const st = stats(r);
  document.getElementById('sHead').innerHTML =
    '<div class="card"><div class="big">' + st.total + ' <span style="font-size:20px;color:var(--muted)">(' + fmtPar(st.vsPar) + ')</span></div>'
    + '<div class="muted">' + esc(r.date) + ' ' + esc(r.courseName) + ' / ' + esc(r.tee) + 'ティー'
    + (st.out && st.in ? ' / OUT ' + st.out + ' · IN ' + st.in : '') + '</div>'
    + (r.weather ? '<div class="muted">' + esc(r.weather) + '</div>' : '') + '</div>';

  document.getElementById('sCard').innerHTML = scorecardHTML(r);

  const S = [];
  const push = (v,l) => S.push('<div><b>' + v + '</b><small>' + l + '</small></div>');
  push(st.putts + (st.puttsPerHole!=null ? ' <span style="font-size:13px;color:var(--muted)">/ ' + st.puttsPerHole + '</span>' : ''), '総パット / 1ホール平均');
  push(st.girPct!=null ? st.girPct + '%' : '—', 'パーオン率 (' + st.gir + '/' + st.girHoles + ')');
  push(st.fwPct!=null ? st.fwPct + '%' : '—', 'フェアウェイキープ (' + st.fwKeep + '/' + st.fwHoles + ')');
  push(st.scramblingPct!=null ? st.scramblingPct + '%' : '—', 'スクランブリング (' + st.scrambling + '/' + st.scramblingHoles + ')');
  push(st.threePutts, '3パット以上のホール');
  push(st.ob + st.penalty, '罰打 (OB ' + st.ob + ')');
  push(st.dist.birdie + st.dist.eagle, 'バーディ以上');
  push(st.dist.dbl + st.dist.tri, 'ダブルボギー以上');
  document.getElementById('sStat').innerHTML = S.join('');

  show('v-summary', isNew ? 'ラウンド終了' : '記録', goHome);
}
function scorecardHTML(r){
  const cls = h => { const d = h.strokes - h.par; return d<0?'bir':(d===0?'':(d===1?'bog':'dbl')); };
  const nine = (from,to,label) => {
    const hs = r.holes.filter(h=>h.no>=from && h.no<=to);
    if(!hs.length) return '';
    const sp = hs.reduce((s,h)=>s+h.par,0);
    const ss = hs.reduce((s,h)=>s+(h.strokes||0),0);
    const su = hs.reduce((s,h)=>s+(h.putts||0),0);
    let t = '<table class="sc"><tr><th>' + label + '</th>' + hs.map(h=>'<th>'+h.no+'</th>').join('') + '<th>計</th></tr>';
    t += '<tr><th>Par</th>' + hs.map(h=>'<td>'+h.par+'</td>').join('') + '<td>'+sp+'</td></tr>';
    t += '<tr><th>打数</th>' + hs.map(h=>'<td class="s '+cls(h)+'">'+(h.strokes==null?'-':h.strokes)+'</td>').join('') + '<td class="s">'+ss+'</td></tr>';
    t += '<tr><th>パット</th>' + hs.map(h=>'<td>'+(h.putts==null?'-':h.putts)+'</td>').join('') + '<td>'+su+'</td></tr>';
    t += '<tr><th>Tee</th>' + hs.map(h=>'<td>'+(h.par>=4 ? (h.fw==='キープ'?'○':(h.fw||'-')) : '—')+'</td>').join('') + '<td></td></tr>';
    return t + '</table>';
  };
  return nine(1,9,'OUT') + nine(10,18,'IN');
}

/* ---------- 書き出し ---------- */
function fileBase(r){
  return (r.date + '_' + r.courseName).replace(/[\/\\:*?"<>|\s]+/g,'_');
}
function roundJSON(r){
  return JSON.stringify({
    schema: 'golf-score/round/1',
    date: r.date, course: r.courseName, location: r.courseLocation || '', tee: r.tee,
    weather: r.weather || '', players: r.players || [],
    startedAt: r.startedAt, finishedAt: r.finishedAt || null,
    holes: r.holes.map(h=>({
      no:h.no, par:h.par, hdcp:h.hdcp, yards:h.yards,
      strokes:h.strokes, putts:h.putts, fairway:h.fw, ob:h.ob||0, penalty:h.penalty||0,
      note: h.note || ''
    })),
    stats: stats(r)
  }, null, 2);
}
function roundMarkdown(r){
  const st = stats(r);
  let m = '# ' + r.date + ' ' + r.courseName + '\n\n';
  m += '- スコア: **' + st.total + '** (' + fmtPar(st.vsPar) + ') / Par ' + st.totalPar + '\n';
  if(st.out && st.in) m += '- OUT ' + st.out + ' / IN ' + st.in + '\n';
  m += '- ティー: ' + r.tee + '\n';
  if(r.weather) m += '- 天候など: ' + r.weather + '\n';
  if(r.players && r.players.length) m += '- 同伴者: ' + r.players.join('、') + '\n';
  m += '- 総パット ' + st.putts + ' (平均 ' + (st.puttsPerHole ?? '-') + ' / 3パット以上 ' + st.threePutts + 'ホール)\n';
  m += '- パーオン ' + st.gir + '/' + st.girHoles + (st.girPct!=null?' ('+st.girPct+'%)':'') + '\n';
  m += '- フェアウェイキープ ' + st.fwKeep + '/' + st.fwHoles + (st.fwPct!=null?' ('+st.fwPct+'%)':'')
     + ' — 左へ ' + st.fwLeft + ' / 右へ ' + st.fwRight + '\n';
  m += '- スクランブリング ' + st.scrambling + '/' + st.scramblingHoles + (st.scramblingPct!=null?' ('+st.scramblingPct+'%)':'') + '\n';
  m += '- OB ' + st.ob + ' / その他の罰打 ' + st.penalty + '\n\n';
  m += '| H | Par | HDCP | Yard | 打数 | 対Par | パット | Tee | OB | 罰 | メモ |\n';
  m += '|---|---|---|---|---|---|---|---|---|---|---|\n';
  r.holes.forEach(h=>{
    const d = h.strokes==null ? '' : fmtPar(h.strokes - h.par);
    m += '| ' + h.no + ' | ' + h.par + ' | ' + (h.hdcp ?? '') + ' | ' + (h.yards ?? '') + ' | '
       + (h.strokes ?? '') + ' | ' + d + ' | ' + (h.putts ?? '') + ' | '
       + (h.par>=4 ? (h.fw || '') : '—') + ' | ' + (h.ob||'') + ' | ' + (h.penalty||'') + ' | ' + (h.note||'') + ' |\n';
  });
  return m;
}
document.getElementById('sSave').onclick = async ()=>{
  const r = summaryRound, base = fileBase(r);
  await saveFiles([
    {name: base + '.json', text: roundJSON(r)},
    {name: base + '.md',   text: roundMarkdown(r)}
  ]);
};
document.getElementById('sPrompt').onclick = async ()=>{
  const r = summaryRound;
  const past = rounds.filter(x=>x.id!==r.id).slice(-8).map(x=>{
    const s = stats(x);
    return '- ' + x.date + ' ' + x.courseName + ': ' + s.total + ' (' + fmtPar(s.vsPar) + ')'
      + ' / パット ' + s.putts + ' / パーオン ' + s.gir + '/' + s.girHoles
      + ' / FW ' + s.fwKeep + '/' + s.fwHoles + ' / 罰打 ' + (s.ob + s.penalty);
  }).join('\n');

  const p =
'あなたはゴルフのコーチです。以下のラウンド記録を分析してください。\n\n'
+ '# 今回のラウンド\n\n' + roundMarkdown(r) + '\n'
+ (past ? '# 過去のラウンド(直近)\n' + past + '\n\n' : '')
+ '# 分析してほしいこと\n\n'
+ '1. **スコアの内訳**。パー比で失った打数を「ティーショット(OB・罰打・FWを外した影響)」「アプローチ/ショット(パーオンできなかったこと)」「パット(3パット等)」の3つにできる範囲で分解し、今日どこで一番損をしたかを打数で示してください。\n'
+ '2. **HDCP順位との突き合わせ**。難しいホール(HDCPが小さい)で崩れているのか、簡単なホール(HDCPが大きい)を取りこぼしているのかを判定してください。後者なら、それが一番もったいない失点です。\n'
+ '3. **崩れ方のパターン**。前半/後半、連続ホール、ダブルボギー以上が出た前後の流れを見て、崩れの引き金になった状況を指摘してください。\n'
+ '4. **過去との比較**(データがあれば)。今回だけの偶然なのか、続いている傾向なのかを区別してください。\n'
+ '5. **次のラウンドに向けた具体策を3つ**。「曲げない」のような精神論ではなく、「このクラブをやめる」「このホールはこう刻む」といった実行可能な形で、期待できる改善打数の見込みとあわせて。\n'
+ '6. **練習メニュー**。1〜3の分析で一番損失の大きかった分野に絞って、優先順位をつけて。\n\n'
+ '推測が必要な箇所は、断定せず「この記録からはここまでしか言えない」と明示してください。\n';

  try{
    await navigator.clipboard.writeText(p);
    toast('コピーしました。Claudeに貼り付けてください。', 3000);
  }catch(e){
    const w = window.open('', '_blank');
    if(w){ w.document.write('<pre style="white-space:pre-wrap;font-size:14px;padding:12px">' + esc(p) + '</pre>'); }
    else alert(p);
  }
};
document.getElementById('sHome').onclick = goHome;

/* ---------- 起動 ---------- */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeunload', (e)=>{
  if(cur && cur.holes.some(h=>h.strokes!=null)){ e.preventDefault(); e.returnValue=''; }
});
renderSaveDirNote();
goHome();
